name: tradingapps
description: "Virtual Trading AI"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.1
  http: ^1.2.0
  country_picker: ^2.0.26
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.4.2
  webview_flutter_web: ^0.2.3+4
  web_socket_channel: ^2.4.0
  shared_preferences: ^2.5.3
  firebase_core: ^4.1.10
  cloud_firestore: ^6.0.0
  firebase_auth: ^6.0.0
  image_picker: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.jpg
  adaptive_icon_background: "#050814"
  adaptive_icon_foreground: assets/branding/app_icon.jpg
  web:
    generate: true
    image_path: assets/branding/app_icon.jpg
    background_color: "#050814"
    theme_color: "#050814"

flutter_native_splash:
  color: "#050814"
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  android_12:
    color: "#050814"
  web: true

